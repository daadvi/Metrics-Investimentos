name: Windows EXE | Metrics Investimentos

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sem cache: o projeto ainda não possui package-lock.json.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxe dos componentes principais
        run: |
          node --check server.mjs
          node --check src/store.mjs
          node --check src/extensions.mjs
          node --check src/instrument-classes.mjs
          node --check src/foreign-ledger.mjs
          node --check src/fx.mjs
          node --check src/tax-dossier.mjs
          node --check src/issuer-notices.mjs
          node --check src/cvm-fii.mjs
          node --check src/dividend-reconciliation.mjs
          node --check src/cvm-quarterly.mjs
          node --check src/brapi-dividends.mjs
          node --check src/tax-audit-v13.mjs
          node --check src/data-health-v13.mjs
          node --check src/provider-hub.mjs
          node --check src/cvm-ipe.mjs
          node --check src/cvm-dfp.mjs
          node --check src/fiscal-evidence-v14.mjs
          node --check src/ai-tools.mjs
          node --check web/app.js
          node --check desktop/main.cjs

      - name: Executar testes
        run: npm test

      - name: Compilar EXE portátil Windows
        run: npm run desktop:build -- --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'

      - name: Validar executável gerado
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter *.exe -File
          if ($files.Count -eq 0) { throw "Nenhum .exe foi gerado em dist/" }
          $files | ForEach-Object { Write-Host "EXE: $($_.Name) | $($_.Length) bytes" }

      - name: Disponibilizar EXE para download
        uses: actions/upload-artifact@v4
        with:
          name: Metrics-Investimentos-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
