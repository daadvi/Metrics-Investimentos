name: Metrics 3.0 | Validacao de release
on:
  push:
    branches: ['release/3.0.0']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Testar em ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Instalar com lockfile
        run: npm ci --no-audit --no-fund
      - name: Instalar Chromium de teste
        run: npx playwright install chromium
      - name: Testes completos, interface e verificacoes de release
        run: npm run verify:release
      - name: Compilar executavel do sistema operacional
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "$RUNNER_OS" = 'Windows' ]; then
            npm run desktop:build -- --win portable --x64
          else
            npm run desktop:build -- --linux AppImage --x64
          fi
      - name: Verificar arquivos de distribuicao
        shell: pwsh
        run: |
          $ext = if ($IsWindows) { '*.exe' } else { '*.AppImage' }
          $files = @(Get-ChildItem -Path dist -Filter $ext -File)
          if ($files.Count -eq 0) { throw "Nenhum artefato $ext encontrado" }
          foreach ($f in $files) {
            if ($f.Length -lt 10000000) { throw "Artefato inesperadamente pequeno: $($f.Name)" }
            $h = Get-FileHash -Path $f.FullName -Algorithm SHA256
            Write-Host "SHA256 $($f.Name): $($h.Hash)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-3.0-${{ matrix.os }}-nao-assinado
          path: |
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 15
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: metrics-3.0-falhas-${{ matrix.os }}
          path: test-results/
          retention-days: 10
